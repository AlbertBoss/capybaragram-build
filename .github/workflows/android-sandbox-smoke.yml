# SPDX-License-Identifier: MIT
name: Android native Test DC login
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: capybaragram-android-sandbox-smoke
  cancel-in-progress: false
jobs:
  client:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          repository: AlbertBoss/capybaragram-build
          run-id: 34005401918
          name: capybaragram-android-preview-arm64
          path: ${{ runner.temp }}/client-input
          github-token: ${{ github.token }}
      - name: Reject stale UI observation regressions
        run: python3 ci/test_android_observer.py
      - name: Prepare standard runner emulator
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;36.0.0' 'platform-tools' 'emulator' 'system-images;android-30;google_apis;x86_64'
      - name: Check native login using one reserved Test DC account
        env:
          CAPY_TEST_LOCALE: en-US
        run: python3 ci/android_sandbox_smoke.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: capybaragram-android-sandbox-smoke
          path: ci/sandbox-smoke-results/
          retention-days: 3
          if-no-files-found: error
