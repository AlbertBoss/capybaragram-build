# SPDX-License-Identifier: MIT
name: Windows release ATL toolchain check
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: capybaragram-release-toolchain
  cancel-in-progress: false
jobs:
  toolchain:
    if: github.event.repository.private == false
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare exact compiler and required ATL component
        shell: pwsh
        run: ./ci/windows.ps1 -Phase Preflight -Profile Candidate
      - name: Compile ATL includes with selected compiler
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'capy-atl-probe.cpp'
          @'
          #include <atlbase.h>
          #include <atlcomcli.h>
          int main() { CComPtr<IUnknown> value; return value ? 1 : 0; }
          '@ | Set-Content -LiteralPath $source -Encoding utf8
          $batch = Join-Path $env:RUNNER_TEMP 'capy-atl-probe.cmd'
          @'
          @echo off
          call "%CAPY_VSDEVCMD%" -no_logo -arch=x64 -host_arch=x64 -winsdk=10.0.26100.0 -vcvars_ver=14.44
          if errorlevel 1 exit /b 1
          cd /d "%RUNNER_TEMP%"
          cl /nologo /EHsc /W4 /WX capy-atl-probe.cpp /Fe:capy-atl-probe.exe
          if errorlevel 1 exit /b 2
          capy-atl-probe.exe
          if errorlevel 1 exit /b 3
          echo CAPY_ATL_NATIVE=PASS
          '@ | Set-Content -LiteralPath $batch -Encoding ascii
          & cmd.exe /d /c $batch
          if ($LASTEXITCODE -ne 0) { throw 'Native ATL compile/run failed.' }
