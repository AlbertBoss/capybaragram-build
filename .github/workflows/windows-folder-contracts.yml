# SPDX-License-Identifier: MIT
name: Native folder reload response ordering
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: capybaragram-folder-contracts
  cancel-in-progress: false
jobs:
  contracts:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: telegramdesktop/tdesktop
          ref: 80158983dba09d3bf5d96701f21473d6c34bf5f5
          path: desktop
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            Telegram/SourceFiles/boxes/choose_filter_box.cpp
            Telegram/SourceFiles/data/data_chat_filters.cpp
            Telegram/SourceFiles/data/data_chat_filters.h
            Telegram/SourceFiles/boxes/filters/edit_filter_box.cpp
            Telegram/SourceFiles/api/api_chat_filters.cpp
            Telegram/SourceFiles/settings/sections/settings_folders.cpp
      - name: Compile actual native methods and inject ordered responses
        shell: bash
        run: |
          mkdir -p reports
          python3 control/ci/folders/test_windows_reconcile.py desktop 2>&1 | tee reports/native-reload-test.txt
          python3 control/ci/folders/test_windows_order.py desktop 2>&1 | tee reports/native-order-test.txt
          python3 control/ci/folders/prepare_windows_reconcile.py desktop
          python3 control/ci/folders/prepare_windows_reconcile.py desktop --check
          python3 control/ci/folders/test_windows_save_share.py desktop 2>&1 | tee reports/native-save-share-test.txt
          python3 control/ci/folders/prepare_windows_mutations.py desktop
          python3 control/ci/folders/prepare_windows_mutations.py desktop --check
          python3 control/ci/folders/test_windows_bulk.py desktop 2>&1 | tee reports/native-bulk-test.txt
          python3 control/ci/folders/prepare_windows_bulk.py desktop
          python3 control/ci/folders/prepare_windows_bulk.py desktop --check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: capybaragram-folder-reload-contracts
          path: reports/
          retention-days: 1
          if-no-files-found: error
