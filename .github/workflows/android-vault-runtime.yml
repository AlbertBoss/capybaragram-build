# SPDX-License-Identifier: MIT
name: Android native vault runtime checks
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: capybaragram-vault-runtime
  cancel-in-progress: false
jobs:
  vault:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare standard runner Android emulator tools
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
          # Hosted image must already contain accepted SDK licenses.
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools' 'emulator' 'system-images;android-30;google_apis;x86_64'
      - name: Compile and execute AndroidKeyStore and SQLite scenarios
        run: python3 ci/vault/run_android.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: capybaragram-vault-runtime-results
          path: ci/vault/test-results/
          retention-days: 1
          if-no-files-found: error
