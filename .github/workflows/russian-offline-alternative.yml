# SPDX-License-Identifier: MIT
name: Public Russian offline alternative admission test
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: capybaragram-vosk-offline-test
  cancel-in-progress: false
jobs:
  benchmark:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: control
          persist-credentials: false
      - name: Install Ubuntu decoder and syscall filter for this disposable test host
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg libseccomp2
      - name: Test five public Russian clips through pinned offline C API
        run: python3 control/ci/speech-vosk/run_benchmark.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: capybaragram-vosk-public-russian-test
          path: vosk-report/*
          if-no-files-found: error
          retention-days: 3
