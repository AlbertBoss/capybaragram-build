# SPDX-License-Identifier: MIT
name: Windows mixed import startup regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    if: github.event.repository.private == false
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
      - name: Select exact production compiler
        shell: pwsh
        run: |
          ./ci/windows.ps1 -Phase Preflight -Profile Baseline
          if ($LASTEXITCODE -ne 0) { throw 'Production toolchain unavailable.' }
          rustup toolchain install 1.88.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Rust unavailable.' }
      - name: Reproduce mixed delay imports and verify eager imports
        shell: pwsh
        run: |
          $batch = Join-Path $env:RUNNER_TEMP 'capy-delay-import-probe.cmd'
          $script = Join-Path $env:GITHUB_WORKSPACE 'ci/windows-delay-imports/run_probe.py'
          @('@echo off', 'call "%CAPY_VSDEVCMD%" -no_logo -arch=x64 -host_arch=x64 -winsdk=10.0.26100.0 -vcvars_ver=14.44',
            'if errorlevel 1 (exit /b 1) else if not errorlevel 0 (exit /b 1)',
            ('python "' + $script + '"'), 'exit /b %errorlevel%') | Set-Content -LiteralPath $batch -Encoding ascii
          & $batch
          if ($LASTEXITCODE -ne 0) { throw 'Native startup regression not accepted.' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: windows-mixed-delay-import-regression
          path: ci/windows-delay-imports/test-results/*
          retention-days: 7
          if-no-files-found: error
