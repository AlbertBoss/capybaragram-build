# SPDX-License-Identifier: MIT
name: Android account source and native selector checks
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: capybaragram-account-contracts
  cancel-in-progress: false
jobs:
  contracts:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DrKLO/Telegram
          ref: 62b56a07ca7e30e39f7fd00a6728d6bbd716ca1c
          path: source
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /TMessagesProj/src/main/java/org/telegram/messenger/UserConfig.java
            /TMessagesProj/src/main/java/org/telegram/messenger/NotificationsController.java
            /TMessagesProj/src/main/java/org/telegram/ui/UserInfoActivity.java
            /TMessagesProj/jni/tgnet/Defines.h
            /TMessagesProj/jni/tgnet/ConnectionsManager.cpp
      - name: Check source contracts and compile actual native selector
        run: python3 control/ci/accounts/test_android_accounts.py source --native
