# SPDX-License-Identifier: MIT
name: Android connection actual JNI runtime
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: capybaragram-android-connection-device
  cancel-in-progress: false
jobs:
  device:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare exact native tools and isolated Android emulator
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
          rustup toolchain install 1.88.0 --profile minimal --component clippy
          rustup target add --toolchain 1.88.0 aarch64-linux-android x86_64-linux-android
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools' 'emulator' 'system-images;android-30;google_apis;x86_64' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Build and verify the exact production JNI source and frozen lock
        run: python ci/android-connection/run_android_checks.py
      - name: Execute actual JNI loopback lifecycle and boundary checks on API 30
        run: python ci/android-connection/run_android_runtime.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: capy-android-connection-device
          path: |
            ci/android-connection/test-results/
            ci/android-connection/runtime-results/
          retention-days: 1
          if-no-files-found: error
