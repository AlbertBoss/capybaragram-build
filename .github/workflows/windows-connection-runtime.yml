# SPDX-License-Identifier: MIT
name: Windows connection worker runtime
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: capybaragram-windows-connection-worker
  cancel-in-progress: false
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install exact Rust compiler
        shell: bash
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Compile and exercise actual connection controller
        run: python ci/windows-connection/run_worker_runtime.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: capy-native-connection-worker-${{ matrix.os }}
          path: ci/windows-connection/test-results/
          retention-days: 1
          if-no-files-found: error
