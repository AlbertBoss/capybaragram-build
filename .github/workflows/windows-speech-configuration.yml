# SPDX-License-Identifier: MIT
name: Windows strict speech configuration
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: capybaragram-windows-speech-configuration
  cancel-in-progress: false
jobs:
  msvc:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Compile pinned Whisper with strict CMake and production MSVC
        shell: pwsh
        run: |
          $vswhere = 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe'
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $installation) { throw 'MSVC installation unavailable.' }
          $vcvars = Join-Path $installation.Trim() 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path -LiteralPath $vcvars)) { throw 'MSVC environment unavailable.' }
          $batch = Join-Path $env:RUNNER_TEMP 'capy-strict-speech.cmd'
          @('@echo off', ('call "' + $vcvars + '" -vcvars_ver=14.44'), 'if errorlevel 1 exit /b 1',
            'python ci/transcription/run_engine_checks.py cpu --strict-msvc-configure', 'exit /b %errorlevel%') | Set-Content -LiteralPath $batch -Encoding ascii
          & cmd.exe /d /c $batch
          if ($LASTEXITCODE -ne 0) { throw 'Strict speech configuration, compile or inference failed.' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: capy-windows-strict-speech-results
          path: ci/transcription/test-results/
          retention-days: 1
          if-no-files-found: error
